[project]
name = "reliable-multi-agent-financial-debate"
version = "0.1.0"
description = "An explainable multi-agent financial debate demonstration"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "groq>=0.30,<1",
    "langgraph>=0.6,<2",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.11,<3",
    "requests>=2.32,<3",
    "yfinance>=0.2.65,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["."]
