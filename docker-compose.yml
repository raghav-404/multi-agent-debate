services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: debate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: debates
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - debate_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U debate -d debates"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  debate_postgres_data:
